<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modem AT Console</title>
<style>
body{font:16px sans-serif;margin:2rem;background:#f6f7f9;color:#20242a}main{max-width:900px;margin:auto}textarea{width:100%;min-height:20rem;font:14px monospace;box-sizing:border-box}form{display:flex;gap:.5rem;margin-top:1rem}input{flex:1;padding:.7rem;font:16px monospace}button{padding:.7rem 1rem}pre{white-space:pre-wrap;background:#171a1f;color:#d8e1ea;padding:1rem;min-height:8rem}
</style>
</head>
<body><main>
<h1>Modem AT Console</h1>
<p>仅执行 modem AT 命令，不提供 Linux shell。写入命令需要显式确认。</p>
<pre id="output" aria-live="polite"></pre>
<form id="command-form"><input id="command" autocomplete="off" placeholder="AT+CSQ" aria-label="AT command"><label><input id="confirm-write" type="checkbox"> 确认执行写入命令</label><button type="submit">发送</button></form>
</main>
<script>
(() => {
  const output = document.getElementById('output');
  const input = document.getElementById('command');
  const confirmWrite = document.getElementById('confirm-write');
  const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/console/ws`);
  socket.onmessage = (event) => {
    try {
      const value = JSON.parse(event.data);
      output.textContent += `${value.response || value.error || ''}\n`;
    } catch (_) { output.textContent += `${event.data}\n`; }
  };
  document.getElementById('command-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const command = input.value.trim();
    if (!command || socket.readyState !== WebSocket.OPEN) return;
    const write = !/^AT(?:I|$|\+[^=]*(?:\?|$))/i.test(command);
    if (write && !confirmWrite.checked) {
      output.textContent += '写入命令需要勾选确认。\n';
      return;
    }
    const submitted = write ? `CONFIRM ${command}` : command;
    output.textContent += `> ${command}\n`;
    socket.send(submitted);
    input.value = '';
  });
})();
</script>
</body>
</html>
